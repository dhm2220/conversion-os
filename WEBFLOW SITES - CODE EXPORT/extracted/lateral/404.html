  <script>
$( document ).ready(function() {
  //turnLight();
 // localStorage.setItem("dark-mode", "off");
	var checkDarkMode = localStorage.getItem("dark-mode");
  if(checkDarkMode === 'on'){
  	turnDark();
    console.log("dark");
  }else{
  	turnLight();
    console.log("light");
  }
});
function turnDark(){
	$('.main-wrapper').addClass('dark-mode');
  $('.page-wrapper').addClass('dark-mode');
  $('.light-mode_trigger').css('display','none');
  $('.dark-mode_trigger').css('display','block');
}
function turnLight(){
	$('.main-wrapper').removeClass('dark-mode');
  $('.page-wrapper').removeClass('dark-mode');
   $('.light-mode_trigger').css('display','block');
  $('.dark-mode_trigger').css('display','none');
}
$('.dark-mode_trigger').click(function(){
	turnLight();
  localStorage.setItem("dark-mode", "off");
})
$('.light-mode_trigger').click(function(){
  	turnDark();
    localStorage.setItem("dark-mode", "on");
})
</script>

    let angle = 0;

        angle = (angle + 1) % 360; // Increment angle and loop it between 0 to 360
        $('.main-rotator_x').css('background-image', `conic-gradient(from ${angle}deg, rgba(214, 233, 255, 0.15) 315deg, rgb(255, 111, 0) 360deg)`);
    }, 30); // Change the interval speed here (30ms for smooth rotation)
});
// Wait for the DOM to fully load
document.addEventListener('DOMContentLoaded', function() {
    // Select the .w-form and .w-form-fail elements
    const wForm = document.querySelector('.free_quote-form');
    const wFormDone = document.querySelector('.w-form-done');
    // Get the computed height of .w-form-fail
    const failHeight = window.getComputedStyle(wForm).height;
    wFormDone.classList.add("success-message");
    // Set the same height for .w-form
    wForm.style.height = failHeight;
});
window.addEventListener("scroll", function() {
  var navbar = document.querySelector(".navbar-section");
  // Check if the device width is less than 992px and scroll position is more than 50px
  if (window.innerWidth < 992 && window.scrollY > 50) {
    navbar.classList.add("dark");
  } else {
    navbar.classList.remove("dark");
  }
});
// Optional: Check window resize to add/remove the class based on the current width
window.addEventListener("resize", function() {
  var navbar = document.querySelector(".navbar-section");
  // Remove the dark class if the width is above 992px
  if (window.innerWidth >= 992) {
    navbar.classList.remove("dark");
  }
});
</script>
